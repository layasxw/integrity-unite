version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: integrity_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Uncomment when DB is added:
    # depends_on:
    #   db:
    #     condition: service_healthy
    networks:
      - app_network

  # ── PostgreSQL (uncomment when ready) ────────────────────────────────────────
